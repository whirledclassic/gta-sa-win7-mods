<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GroveLink</title>
<style>
  :root { --g:#2cff6a; --bg:#070b08; --panel:#10180f; --dim:#7aaa7a; --ink:#041006; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#d7ffd0; font-family: Arial, Helvetica, sans-serif; }
  .shell { max-width: 440px; margin: 0 auto; min-height: 100vh; background:linear-gradient(#0d160e,#10180f 30%); display:flex; flex-direction:column; }
  header { padding:16px 16px 10px; background:#071109; border-bottom:2px solid var(--g); }
  .rowtop { display:flex; justify-content:space-between; align-items:center; }
  h1 { margin:0; font-size:18px; letter-spacing:3px; color:var(--g); }
  .live { font-size:11px; color:var(--g); }
  .live:before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--g); margin-right:6px; }
  .sub { font-size:12px; color:var(--dim); margin-top:6px; }
  .tabs { display:flex; }
  .tabs button { flex:1; background:#0b140c; color:var(--dim); border:0; padding:11px; font-weight:bold; letter-spacing:1px; }
  .tabs button.on { color:var(--ink); background:var(--g); }
  #chatbox { flex:1; overflow-y:auto; padding:12px; min-height: 42vh; }
  .row { margin:0 0 10px; max-width:82%; }
  .row.me { margin-left:auto; }
  .bub { padding:10px 12px; border-radius:14px; font-size:15px; line-height:1.35; }
  .them .bub { background:#1a2a1c; border:1px solid #1a4; }
  .me .bub { background:var(--g); color:var(--ink); }
  .who { font-size:10px; color:var(--dim); margin-bottom:3px; letter-spacing:1px; }
  .me .who { text-align:right; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px 0; }
  .chips button { background:#0b140c; color:var(--g); border:1px solid #1a4; border-radius:999px; padding:7px 10px; font-size:12px; }
  form { display:flex; gap:8px; padding:12px; background:#10180f; border-top:1px solid #1a4; }
  input[type=text] { flex:1; padding:12px; border:1px solid var(--g); background:#0b0f0c; color:#d7ffd0; font-size:16px; border-radius:8px; }
  button.go { background:var(--g); color:var(--ink); border:0; padding:12px 14px; font-weight:bold; border-radius:8px; }
  button.ring { background:#ff3b3b; color:#fff; border:0; padding:12px 12px; font-weight:bold; border-radius:8px; }
  .ok { padding:0 12px 8px; color:var(--g); font-size:12px; min-height:16px; }
  .shot { margin:12px; background:#000; border:1px solid #1a4; }
  .shot img { width:100%; display:block; }
  .meta { padding:6px 10px; font-size:11px; color:var(--dim); }
  .empty { padding:28px 16px; color:var(--dim); }
  #photos { display:none; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="rowtop">
      <h1>GROVELINK</h1>
      <div class="live">CJ LIVE</div>
    </div>
    <div class="sub">Text or ring CJ in San Andreas · <span id="count">0</span> shots</div>
  </header>
  <div class="tabs">
    <button id="tchat" class="on" type="button">CHAT</button>
    <button id="tphoto" type="button">PHOTOS</button>
  </div>
  <div id="chatbox"><div class="empty">Say something. In GTA press K, then MESSAGES.</div></div>
  <div id="photos"></div>
  <div class="chips">
    <button type="button" data-msg="Where you at?">Where you at?</button>
    <button type="button" data-msg="Meet at Grove">Meet at Grove</button>
    <button type="button" data-msg="You good?">You good?</button>
    <button type="button" data-msg="Need a ride">Need a ride</button>
  </div>
  <div class="ok" id="ok"></div>
  <form id="f">
    <button class="ring" id="ring" type="button">RING</button>
    <input id="msg" type="text" maxlength="80" placeholder="Text CJ..." required>
    <button class="go" type="submit">SEND</button>
  </form>
</div>
<script>
function bubble(row) {
  var me = row.from === 'CJ';
  var who = me ? 'CJ' : (row.from || 'PHONE');
  var cls = me ? 'row me' : 'row them';
  return '<div class="'+cls+'"><div class="who">'+who+'</div><div class="bub"></div></div>';
}
function paint(data) {
  var chat = data.chat || [];
  var photos = data.photos || [];
  document.getElementById('count').textContent = photos.length;
  var box = document.getElementById('chatbox');
  if (!chat.length) {
    box.innerHTML = '<div class="empty">Say something. In GTA press K, then MESSAGES.</div>';
  } else {
    box.innerHTML = '';
    for (var i = 0; i < chat.length; i++) {
      var wrap = document.createElement('div');
      wrap.innerHTML = bubble(chat[i]);
      var node = wrap.firstChild;
      node.querySelector('.bub').textContent = chat[i].text || '';
      box.appendChild(node);
    }
    box.scrollTop = box.scrollHeight;
  }
  var feed = document.getElementById('photos');
  if (!photos.length) {
    feed.innerHTML = '<div class="empty">In GTA: K, CAMERA, ENTER.</div>';
  } else {
    var html = '';
    for (var j = 0; j < photos.length && j < 20; j++) {
      var name = photos[j].file || photos[j];
      html += '<div class="shot"><img src="/photo/' + name + '" alt="shot"><div class="meta">' + name + '</div></div>';
    }
    feed.innerHTML = html;
  }
}
function poll() {
  var x = new XMLHttpRequest();
  x.open('GET', '/api', true);
  x.onreadystatechange = function() {
    if (x.readyState === 4 && x.status === 200) {
      try { paint(JSON.parse(x.responseText)); } catch (e) {}
    }
  };
  x.send();
}
function postBody(body) {
  var x = new XMLHttpRequest();
  x.open('POST', '/send', true);
  x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  x.onreadystatechange = function() {
    if (x.readyState === 4) {
      document.getElementById('ok').textContent = body.indexOf('kind=1') >= 0 ? 'Ringing CJ...' : 'Sent to CJ.';
      poll();
      setTimeout(function(){ document.getElementById('ok').textContent = ''; }, 2000);
    }
  };
  x.send(body);
}
document.getElementById('tchat').onclick = function() {
  document.getElementById('tchat').className = 'on';
  document.getElementById('tphoto').className = '';
  document.getElementById('chatbox').style.display = 'block';
  document.getElementById('photos').style.display = 'none';
};
document.getElementById('tphoto').onclick = function() {
  document.getElementById('tphoto').className = 'on';
  document.getElementById('tchat').className = '';
  document.getElementById('chatbox').style.display = 'none';
  document.getElementById('photos').style.display = 'block';
};
document.getElementById('f').onsubmit = function(ev) {
  ev.preventDefault();
  var msg = document.getElementById('msg').value;
  postBody('kind=0&msg=' + encodeURIComponent(msg));
  document.getElementById('msg').value = '';
};
document.getElementById('ring').onclick = function() {
  postBody('kind=1&msg=RING');
};
var chips = document.querySelectorAll('.chips button');
for (var c = 0; c < chips.length; c++) {
  chips[c].onclick = function() {
    postBody('kind=0&msg=' + encodeURIComponent(this.getAttribute('data-msg')));
  };
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
