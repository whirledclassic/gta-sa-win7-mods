; GroveLink one-click updater source
; ==================================
; Which GitHub branch UPDATE_GROVELINK.bat downloads.
;
; Keep this until PR #1 is merged into main:
branch=fix/grovelink-camera-snapshots
;
; After merge PR #1, set branch=main
; (see also root README.md note).
;
; Optional: set release=latest to try GitHub Releases zipball first
; (falls back to the branch zip above if no release exists).
; release=latest
;
; Override anytime with env UPDATE_BRANCH=...
